[package]
name = "atelier-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
reqwest.workspace = true
hyper = "=1.12.0"
axum = "=0.8.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
getrandom = "=0.4.3"
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
ring = "=0.17.14"
base64 = "=0.22.1"
html-escape = "=0.2.15"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
regex = "=1.13.1"
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
uuid = { version = "=1.29.0", features = ["v4"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Globalization", "Win32_Networking_WinSock", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_NetworkManagement_IpHelper", "Win32_Security_Authorization", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "=5.19.0"
