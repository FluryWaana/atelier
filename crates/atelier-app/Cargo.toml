[package]
name = "atelier-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
axum = "=0.8.9"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
getrandom = "=0.4.3"
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
uuid = { version = "=1.29.0", features = ["v4"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
time = { version = "=0.3.55", features = ["formatting", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
reqwest.workspace = true
