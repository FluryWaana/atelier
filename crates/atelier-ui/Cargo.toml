[package]
name = "atelier-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
atelier-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "=0.8.22", features = ["csr"] }
gloo-net = "=0.7.0"
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["AbortSignal", "Window", "Document", "HtmlElement", "DomRect", "DragEvent", "DataTransfer", "Location", "Storage", "History", "UrlSearchParams", "HtmlDialogElement", "BeforeUnloadEvent", "EventSource", "MessageEvent", "Blob", "Url", "HtmlAnchorElement", "Navigator", "Clipboard", "ValidityState", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlFormElement", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }
