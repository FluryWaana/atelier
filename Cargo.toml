[workspace]
members = ["crates/atelier-core", "crates/atelier-app", "crates/atelier-ui", "xtask"]
default-members = ["crates/atelier-core", "crates/atelier-app", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
atelier-core = { path = "crates/atelier-core" }
atelier-app = { path = "crates/atelier-app" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process", "io-util"] }
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = "thin"
strip = true

[profile.release.package.atelier-ui]
opt-level = "s"

[profile.dev.package.atelier-ui]
opt-level = 1
