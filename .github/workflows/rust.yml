name: Rust rebuild
on:
  # Manual only; corrective checks select one family/browser/journey.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Verification family; partial runs never qualify the whole rebuild'
        type: choice
        default: browser
        options: [browser, delivery, native, full]
      browser:
        description: 'Browser for scope=browser'
        type: choice
        default: chrome
        options: [chrome, firefox, edge, safari, all]
      journey:
        description: 'Journey for scope=browser'
        type: choice
        default: jira
        options: [jira, application, updates, all]
      platform:
        description: 'Platform for native/delivery; all explicitly selects all five'
        type: choice
        default: windows
        options: [windows, linux, linux-arm, macos, macos-intel, all]
      full_matrix:
        description: 'Legacy shortcut: override platform with all five'
        type: boolean
        default: false
permissions:
  contents: read
env:
  ATELIER_RUST_FINAL_CAMPAIGN: '1'
concurrency:
  group: rust-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selection:
    runs-on: ubuntu-24.04
    outputs:
      browser_os: ${{ steps.select.outputs.browser_os }}
      target_os: ${{ steps.select.outputs.target_os }}
    steps:
      - id: select
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_BROWSER: ${{ inputs.browser }}
          REQUESTED_JOURNEY: ${{ inputs.journey }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          RUN_ALL_PLATFORMS: ${{ inputs.full_matrix }}
        run: |
          case "$REQUESTED_SCOPE" in full|native|browser|delivery) ;; *) exit 2;; esac
          case "$REQUESTED_BROWSER" in all|edge|chrome|firefox|safari) ;; *) exit 2;; esac
          case "$REQUESTED_JOURNEY" in all|application|jira|updates) ;; *) exit 2;; esac
          case "$REQUESTED_PLATFORM" in windows|linux|linux-arm|macos|macos-intel|all) ;; *) exit 2;; esac
          if [ "$RUN_ALL_PLATFORMS" = true ]; then REQUESTED_PLATFORM=all; fi
          case "$REQUESTED_PLATFORM" in
            windows) target_os='["windows-latest"]';;
            linux) target_os='["ubuntu-24.04"]';;
            linux-arm) target_os='["ubuntu-24.04-arm"]';;
            macos) target_os='["macos-15"]';;
            macos-intel) target_os='["macos-15-intel"]';;
            all) target_os='["windows-latest","ubuntu-24.04","ubuntu-24.04-arm","macos-15-intel","macos-15"]';;
          esac
          if [ "$REQUESTED_SCOPE" = full ]; then
            case "$REQUESTED_PLATFORM" in
              windows) browser_os='["windows-latest"]';;
              linux|linux-arm) browser_os='["ubuntu-24.04"]';;
              macos|macos-intel) browser_os='["macos-15"]';;
              all) browser_os='["windows-latest","ubuntu-24.04","macos-15"]';;
            esac
          else
            case "$REQUESTED_BROWSER" in
              edge) browser_os='["windows-latest"]';;
              chrome|firefox) browser_os='["ubuntu-24.04"]';;
              safari) browser_os='["macos-15"]';;
              all) browser_os='["windows-latest","ubuntu-24.04","macos-15"]';;
            esac
          fi
          printf 'browser_os=%s\n' "$browser_os" >> "$GITHUB_OUTPUT"
          printf 'target_os=%s\n' "$target_os" >> "$GITHUB_OUTPUT"
          printf 'Scope: %s; browser/journey (browser scope only): %s/%s; platform: %s\n\nA partial selection is not global qualification. No release is published.\n' "$REQUESTED_SCOPE" "$REQUESTED_BROWSER" "$REQUESTED_JOURNEY" "$REQUESTED_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
  ui-payload:
    needs: selection
    if: inputs.scope != 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-ui-payload-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rust-ui-payload-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wasm-tools
        with:
          path: ${{ runner.temp }}/atelier-tools
          key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-trunk0.22.0-bindgen0.2.129
      - run: cargo install --locked trunk --version 0.22.0 --root "${{ runner.temp }}/atelier-tools"
        if: steps.wasm-tools.outputs.cache-hit != 'true'
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129 --root "${{ runner.temp }}/atelier-tools"
        if: steps.wasm-tools.outputs.cache-hit != 'true'
      - run: echo "${{ runner.temp }}/atelier-tools/bin" >> "$GITHUB_PATH"
      - run: cargo fetch --locked
      - run: cargo xtask build-ui
      - name: Preserve built candidate WASM without claiming browser qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-wasm-ui-candidate
          path: .artifacts/rust-ui/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compilation cache after candidate build
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-ui-payload-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
  native:
    needs: selection
    if: inputs.scope == 'native' || inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.selection.outputs.target_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache Windows Rust builds
        id: windows-rust-cache
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: rustc -vV
      - name: Provision the pinned macOS Git OpenSSL backend for synthetic TLS
        if: runner.os == 'macOS'
        run: bash xtask/packaging/install-macos-git.sh
      - name: Install isolated Linux native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 xfce4-panel xfconf exo-utils xdg-utils xvfb xauth zenity
          if [ ! -f /usr/share/applications/google-chrome.desktop ]; then
            sudo apt-get install -y epiphany-browser
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude atelier-ui --all-targets --locked -- -D warnings
      - name: Verify the current Rust source inventory
        run: cargo xtask inventory --check
      - run: cargo test --workspace --exclude atelier-ui --locked --no-fail-fast
        if: runner.os == 'Windows'
      - name: Native Rust tests with an explicit disposable macOS keychain
        if: runner.os == 'macOS'
        run: bash xtask/packaging/with-macos-keychain.sh cargo test --workspace --exclude atelier-ui --locked --no-fail-fast
      - name: Native Rust tests in a disposable Linux keyring session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          unset GNOME_KEYRING_CONTROL DISPLAY WAYLAND_DISPLAY
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" synthetic-final-tests-password | gnome-keyring-daemon --unlock --components=secrets
            cargo test --workspace --exclude atelier-ui --locked --no-fail-fast
          '
      - run: cargo clippy -p atelier-ui --target wasm32-unknown-unknown --locked -- -D warnings
        if: ${{ !cancelled() }}
      - run: cargo check -p atelier-ui --target wasm32-unknown-unknown --locked
        if: ${{ !cancelled() }}
      - name: Synthetic native TLS integration journeys
        run: cargo test -p atelier-app --test synthetic-tls --locked -- --ignored
      - name: Synthetic native forge publication and reviewed commits over TLS
        run: cargo test -p xtask --test forge-review-tls --locked -- --ignored
      - name: Native DPAPI isolation between disposable Windows accounts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'atelier' + [Guid]::NewGuid().ToString('N').Substring(0, 10)
          $probeBase = [IO.Path]::GetFullPath([Environment]::GetFolderPath('CommonDocuments'))
          $probeRoot = Join-Path $probeBase ('atelier-keyring-' + [Guid]::NewGuid().ToString('N'))
          $source = Join-Path $env:GITHUB_WORKSPACE 'target/debug/native-fixture.exe'
          $probeUser = $null
          $probeProcess = $null
          $created = $false
          try {
            New-Item -ItemType Directory -Path $probeRoot | Out-Null
            $created = $true
            Set-Content -LiteralPath (Join-Path $probeRoot '.keyring-fixture') -Value 'atelier-m02-synthetic-keyring' -NoNewline
            $probeExecutable = Join-Path $probeRoot 'fixture.exe'
            Copy-Item -LiteralPath $source -Destination $probeExecutable
            $password = ConvertTo-SecureString ([Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32)) + 'aA1!') -AsPlainText -Force
            $probeUser = New-LocalUser -Name $name -Password $password -AccountNeverExpires
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $probeUser
            & icacls.exe $probeRoot /grant "*$($probeUser.SID.Value):(OI)(CI)M" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Fixture permissions failed' }
            Push-Location $probeRoot
            try {
              & $probeExecutable keyring-account prepare
              if ($LASTEXITCODE -ne 0) { throw 'DPAPI positive control failed' }
              $credential = [PSCredential]::new("$env:COMPUTERNAME\$name", $password)
              $probeProcess = Start-Process -FilePath $probeExecutable -ArgumentList 'keyring-account other' -WorkingDirectory $probeRoot -Credential $credential -LoadUserProfile -WindowStyle Hidden -PassThru
              if (-not $probeProcess.WaitForExit(30000)) { throw 'DPAPI other-account deadline exceeded' }
              $probeProcess.Refresh()
              if ($probeProcess.ExitCode -ne 0) { throw 'DPAPI other-account control failed' }
              & $probeExecutable keyring-account verify
              if ($LASTEXITCODE -ne 0) { throw 'DPAPI reciprocal refusal failed' }
            } finally { Pop-Location }
          } finally {
            if ($probeProcess -and -not $probeProcess.HasExited) { $probeProcess.Kill(); $probeProcess.WaitForExit() }
            if ($probeUser) { Remove-LocalUser -SID $probeUser.SID }
            if ($created) {
              $resolved = [IO.Path]::GetFullPath($probeRoot)
              if ([IO.Path]::GetDirectoryName($resolved) -ne $probeBase -or [IO.Path]::GetFileName($resolved) -notlike 'atelier-keyring-*') { throw 'Unexpected fixture cleanup path' }
              Remove-Item -LiteralPath $resolved -Recurse -Force
            }
          }
      - name: Native Linux keyring with a disposable data directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          unset GNOME_KEYRING_CONTROL DISPLAY WAYLAND_DISPLAY
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "synthetic-ci-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo xtask test-keyring
            ATELIER_TEST_DISPOSABLE_KEYRING=1 cargo xtask test-keyring-lock
          '
      - name: Native Linux keyring isolation between disposable accounts
        if: runner.os == 'Linux'
        run: bash scripts/rust-keyring-accounts.sh
        env:
          ATELIER_TEST_DISPOSABLE_KEYRING: '1'
      - name: Native macOS keyring with a unique synthetic service
        if: runner.os == 'macOS'
        run: bash xtask/packaging/with-macos-keychain.sh cargo xtask test-keyring
      - name: Native macOS locked disposable keychain
        if: runner.os == 'macOS'
        run: bash xtask/packaging/with-macos-keychain.sh cargo xtask test-keyring-lock
        env:
          ATELIER_TEST_DISPOSABLE_KEYRING: '1'
      - name: Native macOS keychain isolation between disposable accounts
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: bash scripts/rust-keyring-macos-accounts.sh
        env:
          ATELIER_TEST_DISPOSABLE_KEYRING: '1'
      - name: Native Linux tray in an isolated XFCE panel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            test -x /usr/bin/exo-open
            browser_desktop=google-chrome.desktop
            if [ ! -f "/usr/share/applications/$browser_desktop" ]; then
              browser_desktop=org.gnome.Epiphany.desktop
            fi
            test -f "/usr/share/applications/$browser_desktop"
            xdg-mime default "$browser_desktop" text/html x-scheme-handler/http x-scheme-handler/https
            for mime in text/html x-scheme-handler/http x-scheme-handler/https; do
              test "$(xdg-mime query default "$mime")" = "$browser_desktop"
            done
            xfconf-query -c xfce4-panel -p /configver -n -t int -s 2
            xfconf-query -c xfce4-panel -p /panels -n -a -t int -s 1
            xfconf-query -c xfce4-panel -p /panels/panel-1/position -n -t string -s "p=6;x=0;y=0"
            xfconf-query -c xfce4-panel -p /panels/panel-1/plugin-ids -n -a -t int -s 1
            xfconf-query -c xfce4-panel -p /plugins/plugin-1 -n -t string -s systray
            xfce4-panel --disable-wm-check &
            panel_pid=$!
            trap "kill $panel_pid 2>/dev/null || true" EXIT
            cargo xtask test-tray
            cargo test -p atelier-app --test native-tray --locked -- --ignored
          '
      - name: Native Windows product tray lifecycle
        if: runner.os == 'Windows'
        run: cargo test -p atelier-app --test native-tray --locked -- --ignored
      - name: Native Windows portable import chooser and confirmation
        if: runner.os == 'Windows'
        run: cargo test -p atelier-app --test native-import --locked -- --ignored
      - name: Native macOS tray on the main AppKit loop
        if: runner.os == 'macOS'
        run: |
          cargo xtask test-tray
          cargo test -p atelier-app --test native-tray --locked -- --ignored
      - name: Preserve partial Windows Rust cache after verification
        if: always() && runner.os == 'Windows' && steps.windows-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
  browser:
    needs: [selection, ui-payload]
    if: inputs.scope == 'browser' || inputs.scope == 'full'
    env:
      ATELIER_TEST_JOURNEY: ${{ inputs.scope == 'full' && 'all' || inputs.journey }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.selection.outputs.browser_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - name: Restore browser compilation cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-browser-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-browser-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-build-v1-${{ runner.os }}-${{ runner.arch }}-browser-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
            ${{ runner.os == 'Linux' && format('rust-ui-payload-v1-{0}-', hashFiles('Cargo.lock', 'rust-toolchain.toml')) || '' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-wasm-ui-candidate
          path: .artifacts/rust-ui
      - run: cargo fetch --locked
      - name: Install disposable Linux browser keyring prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Edge WASM and restart scenario
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ATELIER_WEBDRIVER = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          $env:ATELIER_TEST_BROWSER = 'edge'
          & $env:ATELIER_WEBDRIVER --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask test-ui --prepared-assets
      - name: Record browser and driver versions
        if: runner.os == 'Linux' && (inputs.scope == 'full' || inputs.browser == 'all' || inputs.browser == 'chrome')
        run: |
          google-chrome --version
          chromedriver --version
      - name: Chrome journey in a disposable Linux keyring session
        if: runner.os == 'Linux' && (inputs.scope == 'full' || inputs.browser == 'all' || inputs.browser == 'chrome')
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          unset GNOME_KEYRING_CONTROL DISPLAY WAYLAND_DISPLAY
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" synthetic-final-chrome-password | gnome-keyring-daemon --unlock --components=secrets
            cargo xtask test-ui --prepared-assets
          '
        env:
          ATELIER_TEST_BROWSER: chrome
      - name: Firefox WASM and restart scenario
        if: ${{ !cancelled() && runner.os == 'Linux' && (inputs.scope == 'full' || inputs.browser == 'all' || inputs.browser == 'firefox') }}
        run: |
          firefox --version
          "$GECKOWEBDRIVER/geckodriver" --version
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export ATELIER_WEBDRIVER="$GECKOWEBDRIVER/geckodriver"
          unset GNOME_KEYRING_CONTROL DISPLAY WAYLAND_DISPLAY
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" synthetic-final-firefox-password | gnome-keyring-daemon --unlock --components=secrets
            cargo xtask test-ui --prepared-assets
          '
        env:
          ATELIER_TEST_BROWSER: firefox
      - name: Safari WASM and restart scenario
        if: runner.os == 'macOS'
        run: |
          sudo safaridriver --enable
          safaridriver --version
          bash xtask/packaging/with-macos-keychain.sh cargo xtask test-ui --prepared-assets
        env:
          ATELIER_TEST_BROWSER: safari
      - name: Preserve synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-ui-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/rust-*.png
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve browser compilation cache after verification
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-browser-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
  delivery:
    needs: [selection, ui-payload]
    if: inputs.scope == 'delivery' || inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.selection.outputs.target_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-delivery-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rust-delivery-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-delivery-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
            rust-build-v1-${{ runner.os }}-${{ runner.arch }}-native-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-wasm-ui-candidate
          path: .artifacts/rust-ui
      - run: cargo fetch --locked
      - name: Install native Linux packaging and synthetic keyring tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm cpio desktop-file-utils libsecret-tools gnome-keyring dbus-x11
      - name: Select the native Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup 6 compiler missing.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ATELIER_ISCC=$compiler"
      - name: Fabricate and exercise real signed portable packages and native installers
        id: fabricate-windows
        if: runner.os == 'Windows'
        run: cargo xtask qualify-packages .artifacts/rust-delivery
      - name: Fabricate and exercise macOS portable with a disposable keychain
        id: fabricate-macos
        if: runner.os == 'macOS'
        run: bash xtask/packaging/with-macos-keychain.sh cargo xtask qualify-packages .artifacts/rust-delivery
      - name: Fabricate and exercise Linux packages in a disposable keyring session
        id: fabricate-linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          unset GNOME_KEYRING_CONTROL DISPLAY WAYLAND_DISPLAY
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" synthetic-final-package-password | gnome-keyring-daemon --unlock --components=secrets
            cargo xtask qualify-packages .artifacts/rust-delivery
          '
      - name: Qualify the real Windows Setup and native uninstaller
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.fabricate-windows.outcome == 'success' }}
        shell: pwsh
        run: ./xtask/packaging/qualify-windows.ps1 -Delivery .artifacts/rust-delivery
      - name: Qualify DEB with its native manager in a disposable container
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.fabricate-linux.outcome == 'success' }}
        shell: bash
        run: |
          delivery="$PWD/.artifacts/rust-delivery"
          docker run --rm -e CI=true -e ATELIER_RUST_FINAL_CAMPAIGN=1 -v "$PWD:/workspace:ro" -v "$delivery:/delivery:ro" -v "$delivery:/results" ubuntu:24.04 sh /workspace/xtask/packaging/qualify-linux.sh deb
      - name: Qualify RPM with its native manager in a disposable container
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.fabricate-linux.outcome == 'success' }}
        shell: bash
        run: |
          delivery="$PWD/.artifacts/rust-delivery"
          docker run --rm -e CI=true -e ATELIER_RUST_FINAL_CAMPAIGN=1 -v "$PWD:/workspace:ro" -v "$delivery:/delivery:ro" -v "$delivery:/results" fedora:43 sh /workspace/xtask/packaging/qualify-linux.sh rpm
      - name: Compile and execute native Rust update and rollback journeys
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.fabricate-windows.outcome == 'success' }}
        run: cargo xtask test-updates --prepared-delivery .artifacts/rust-delivery
      - name: Compile and execute macOS update and rollback with a disposable keychain
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.fabricate-macos.outcome == 'success' }}
        run: bash xtask/packaging/with-macos-keychain.sh cargo xtask test-updates --prepared-delivery .artifacts/rust-delivery
      - name: Compile and execute Linux update and rollback in a disposable keyring session
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.fabricate-linux.outcome == 'success' }}
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          unset GNOME_KEYRING_CONTROL DISPLAY WAYLAND_DISPLAY
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" synthetic-final-update-password | gnome-keyring-daemon --unlock --components=secrets
            cargo xtask test-updates --prepared-delivery .artifacts/rust-delivery
          '
      - name: Preserve actual package evidence without publishing a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-preproduction-candidate-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/rust-delivery/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve package and successor compilation cache after verification
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-delivery-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
