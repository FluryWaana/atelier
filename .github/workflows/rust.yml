name: Rust migration
on:
  push:
    branches: [main, 'codex/rust-migration-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - run: rustc -vV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude atelier-ui --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude atelier-ui --locked
      - run: cargo clippy -p atelier-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo check -p atelier-ui --target wasm32-unknown-unknown --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Compare historical Node data, vault and shared lock
        run: cargo xtask test-storage-parity
        env:
          ATELIER_NODE: node
      - name: Compare historical Node domain contracts
        run: cargo xtask test-domain-parity
        env:
          ATELIER_NODE: node
      - name: Install isolated Linux keyring prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 xfce4-panel xfconf xvfb
      - name: Native Linux keyring with a disposable data directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "synthetic-ci-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo xtask test-keyring
          '
      - name: Native macOS keyring with a unique synthetic service
        if: runner.os == 'macOS'
        run: cargo xtask test-keyring
      - name: Native Linux tray in an isolated XFCE panel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            xfconf-query -c xfce4-panel -p /configver -n -t int -s 2
            xfconf-query -c xfce4-panel -p /panels -n -a -t int -s 1
            xfconf-query -c xfce4-panel -p /panels/panel-1/position -n -t string -s "p=6;x=0;y=0"
            xfconf-query -c xfce4-panel -p /panels/panel-1/plugin-ids -n -a -t int -s 1
            xfconf-query -c xfce4-panel -p /plugins/plugin-1 -n -t string -s systray
            xfce4-panel --disable-wm-check &
            panel_pid=$!
            trap "kill $panel_pid 2>/dev/null || true" EXIT
            cargo xtask test-tray
          '
      - name: Native macOS tray on the main AppKit loop
        if: runner.os == 'macOS'
        run: cargo xtask test-tray
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wasm-tools
        with:
          path: ${{ runner.temp }}/atelier-tools
          key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-trunk0.22.0-bindgen0.2.129
      - run: cargo install --locked trunk --version 0.22.0 --root "${{ runner.temp }}/atelier-tools"
        if: steps.wasm-tools.outputs.cache-hit != 'true'
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129 --root "${{ runner.temp }}/atelier-tools"
        if: steps.wasm-tools.outputs.cache-hit != 'true'
      - run: echo "${{ runner.temp }}/atelier-tools/bin" >> "$GITHUB_PATH"
      - run: cargo fetch --locked
      - name: Record browser and driver versions
        if: runner.os == 'Linux'
        run: |
          google-chrome --version
          chromedriver --version
      - run: cargo xtask test-ui
        if: runner.os == 'Linux'
        env:
          ATELIER_TEST_BROWSER: chrome
      - name: Firefox WASM and restart scenario
        if: runner.os == 'Linux'
        run: |
          firefox --version
          "$GECKOWEBDRIVER/geckodriver" --version
          ATELIER_WEBDRIVER="$GECKOWEBDRIVER/geckodriver" cargo xtask test-ui
        env:
          ATELIER_TEST_BROWSER: firefox
      - name: Safari WASM and restart scenario
        if: runner.os == 'macOS'
        run: |
          sudo safaridriver --enable
          safaridriver --version
          cargo xtask test-ui
        env:
          ATELIER_TEST_BROWSER: safari
