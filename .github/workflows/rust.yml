name: Rust migration
on:
  push:
    branches: [main, 'codex/rust-migration-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - run: rustc -vV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude atelier-ui --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude atelier-ui --locked
      - run: cargo clippy -p atelier-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo check -p atelier-ui --target wasm32-unknown-unknown --locked
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo install --locked trunk --version 0.22.0
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cargo fetch --locked
      - name: Record browser and driver versions
        run: |
          google-chrome --version
          chromedriver --version
      - run: cargo xtask test-ui
        env:
          ATELIER_TEST_BROWSER: chrome
