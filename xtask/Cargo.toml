[package]
name = "xtask"
default-run = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
atelier-app.workspace = true
tokio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
reqwest.workspace = true
fantoccini = { version = "=0.22.1", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
