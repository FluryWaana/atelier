[package]
name = "xtask"
default-run = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
atelier-app.workspace = true
tokio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
reqwest.workspace = true
fantoccini = { version = "=0.22.1", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSStatusItem", "NSStatusBarButton", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSDate", "NSRunLoop", "NSTimer"] }
block2 = "=0.6.2"
