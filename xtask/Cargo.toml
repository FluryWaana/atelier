[package]
name = "xtask"
default-run = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = "=0.8.9"
atelier-app.workspace = true
atelier-core.workspace = true
tokio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2 = "=0.11.1"
time = { version = "=0.3.55", features = ["formatting"] }
reqwest.workspace = true
fantoccini = { version = "=0.22.1", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
cap-std = "=4.0.3"
hyper = "=1.12.0"
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.191"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=6.2.0", features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSStatusItem", "NSStatusBarButton", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSDate", "NSRunLoop", "NSTimer"] }
block2 = "=0.6.2"
